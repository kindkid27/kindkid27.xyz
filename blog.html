---
layout: default
title: Blog
---
<header>
    <h1>Mai Blog :3</h1>
    <p>Latest thoughts, updates, and news!</p>
</header>
<div class="intro">
    <p>Welcome to my blog! (=^ω^=) Here you'll find my latest posts, updates, and kiggy adventures.</p>
</div>
<hr class="divider">
<ul class="blog-list">
    {% for post in site.posts %}
    <li style="background:#ffccff;border:2px dotted #ff66cc;padding:12px;margin:12px 0;border-radius:8px;list-style:none;">
        <a href="{{ post.url | prepend: site.baseurl }}" style="color:#ff0066;text-decoration:none;font-family:'Comic Sans MS','Courier New',cursive;">
            <h3 style="margin:0 0 6px 0;">{{ post.title }}</h3>
            <p style="margin:0;font-size:14px;color:#9900cc;">{{ post.date | date: "%B %d, %Y" }}</p>
        </a>
    </li>
    {% endfor %}
</ul>
